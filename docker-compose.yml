services:
  backend:
    build: .
    ports:
      - "8000:8000"
    # 允许容器通过 host.docker.internal 访问宿主机的 Qdrant / LangFuse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # LM Studio 推理服务地址（宿主机的局域网 IP）
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      LM_STUDIO_EMBED_MODEL: ${LM_STUDIO_EMBED_MODEL:-}
      # LangFuse（本地自托管 Docker，宿主 3000 端口）
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      # Qdrant（本地 Docker，宿主 6333 端口）
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      QDRANT_COLLECTION_NAME: nutrilife_kb
      NODE_CACHE_PATH: /app/data/nodes.json
      KNOWLEDGE_BASE_DIR: /app/data/knowledge_base
      OPENFOODFACTS_MCP_URL: http://openfoodfacts-mcp:28375
    volumes:
      - ./data:/app/data
    depends_on:
      - openfoodfacts-mcp
    restart: unless-stopped

  openfoodfacts-mcp:
    build:
      context: .
      dockerfile: mcp/openfoodfacts/Dockerfile
    ports:
      - "28375:28375"
    environment:
      TRANSPORT: http
      PORT: "28375"
      OFF_USER_AGENT: "NutriLife/0.1 (Open Food Facts MCP)"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
